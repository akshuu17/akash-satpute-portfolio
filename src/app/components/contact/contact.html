<section id="contact" class="contact">

  <h2 class="section-title">Contact Me</h2>

  <div class="contact-wrapper">

    <!-- 🔥 LEFT: FORM -->
    <form (submit)="onSubmit($event)" class="contact-form glass-card">

      <h3>Send Message</h3>

      <div class="input-group">
        <input type="text" required />
        <label>Name</label>
      </div>

      <div class="input-group">
        <input type="email" required />
        <label>Email</label>
      </div>

      <div class="input-group">
        <textarea rows="4" required></textarea>
        <label>Message</label>
      </div>

      <button class="btn primary">Send Message</button>

    </form>

    <!-- 🔥 RIGHT: CONTACT INFO -->
    <div class="contact-info glass-card">

      <h3>Get in Touch</h3>
      <p>Feel free to connect with me through social platforms 👇</p>

      <div class="socials">
        <a href="https://github.com/akshuu17" target="_blank">🐙 GitHub</a>
        <a href="https://www.linkedin.com/in/akash-satpute-8805271571s" target="_blank">💼 LinkedIn</a>
        <a href="https://youtube.com/@17_snapshots" target="_blank">📺 YouTube</a>
      </div>

    </div>

  </div>

  <!-- 🔥 Toast -->
  <div class="toast" *ngIf="showToast">
    🚧 Website under maintenance 🚧
  </div>

</section>
